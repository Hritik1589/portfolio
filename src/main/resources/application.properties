spring.application.name=portfolio-backend

# 1. LOCAL MYSQL DATABASE (Safe for GitHub)
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 2. LOCAL JWT (Dummy Secret - Safe for GitHub)
app.jwt.secret=local_dummy_secret_key_for_testing_only_12345
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# 3. LOCAL EMAIL (Dummy Password - Safe for GitHub)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=dummy_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 4. REDIS & KAFKA (Local)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.kafka.bootstrap-servers=localhost:9092

# 5. CORS (Local Angular App)
app.cors.allowed-origins=http://localhost:4200